name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  user-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: user-service/pom.xml

      - name: Build and test
        run: ./mvnw -B verify