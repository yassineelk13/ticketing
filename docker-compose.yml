services:
  user-db:
    image: postgres:17-alpine
    container_name: billetterie-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USER:-billetterie}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-billetterie}
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USER:-billetterie} -d user_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    container_name: billetterie-user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      USER_DB_USER: ${USER_DB_USER:-billetterie}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-billetterie}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
    ports:
      - "8081:8081"


  event-db:
    image: mongo:8
    container_name: billetterie-event-db
    ports:
      - "27017:27017"
    volumes:
      - event-db-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 10

  event-service:
    build: ./event-service
    container_name: billetterie-event-service
    depends_on:
      event-db:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://event-db:27017/event_db
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8082"
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: event-service
    ports:
      - "8082:8082"

  discovery-server:
    build: ./discovery-server
    container_name: billetterie-discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: billetterie-api-gateway
    depends_on:
      discovery-server:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    ports:
      - "8080:8080"

  ticket-db:
    image: postgres:17-alpine
    container_name: billetterie-ticket-db
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: ${TICKET_DB_USER:-billetterie}
      POSTGRES_PASSWORD: ${TICKET_DB_PASSWORD:-billetterie}
    ports:
      - "5434:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TICKET_DB_USER:-billetterie} -d ticket_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  ticket-service:
    build: ./ticket-service
    container_name: billetterie-ticket-service
    depends_on:
      ticket-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ticket-db:5432/ticket_db
      TICKET_DB_USER: ${TICKET_DB_USER:-billetterie}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:-billetterie}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      EVENT_SERVICE_URL: http://event-service:8082
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ticket-service
    ports:
      - "8083:8083"

  kafka:
    image: apache/kafka:4.0.0
    container_name: billetterie-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  user-db-data:
  event-db-data:
  ticket-db-data: