services:
  user-db:
    image: postgres:17-alpine
    container_name: billetterie-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USER:-billetterie}
      EUREKA_INSTANCE_HOSTNAME: user-service
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-billetterie} -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    container_name: billetterie-user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      USER_DB_USER: ${USER_DB_USER:-billetterie}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-billetterie}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-billetterie}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    ports:
      - "8081:8081"

  event-db:
    image: mongo:8
    container_name: billetterie-event-db
    ports:
      - "27017:27017"
    volumes:
      - event-db-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 10

  event-service:
    build: ./event-service
    container_name: billetterie-event-service
    depends_on:
      event-db:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://event-db:27017/event_db
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8082"
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: event-service
    ports:
      - "8082:8082"

  discovery-server:
    build: ./discovery-server
    container_name: billetterie-discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: billetterie-api-gateway
    depends_on:
      discovery-server:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    ports:
      - "8080:8080"

volumes:
  user-db-data:
  event-db-data: