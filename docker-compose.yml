services:
  user-db:
    image: postgres:17-alpine
    container_name: billetterie-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USER:-billetterie}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-billetterie}
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-billetterie} -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    container_name: billetterie-user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      USER_DB_USER: ${USER_DB_USER:-billetterie}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-billetterie}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"

  event-db:
    image: mongo:8
    container_name: billetterie-event-db
    ports:
      - "27017:27017"
    volumes:
      - event-db-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 10

  event-service:
    build: ./event-service
    container_name: billetterie-event-service
    depends_on:
      event-db:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://event-db:27017/event_db
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"

volumes:
  user-db-data:
  event-db-data: