spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Route vers user-service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${app.routes.users-uri:lb://user-service}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# Route vers event-service
spring.cloud.gateway.server.webflux.routes[1].id=event-service
spring.cloud.gateway.server.webflux.routes[1].uri=${app.routes.events-uri:lb://event-service}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/events/**

# Route vers ticket-service
spring.cloud.gateway.server.webflux.routes[2].id=ticket-service
spring.cloud.gateway.server.webflux.routes[2].uri=${app.routes.tickets-uri:lb://ticket-service}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/tickets/**

# Actuator
management.endpoints.web.exposure.include=health