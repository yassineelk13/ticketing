spring.application.name=ticket-service
server.port=8083

# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5434/ticket_db
spring.datasource.username=${TICKET_DB_USER:billetterie}
spring.datasource.password=${TICKET_DB_PASSWORD:billetterie}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT (meme secret que les autres services)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}

# Appel a l'event-service
app.event-service.url=${EVENT_SERVICE_URL:http://localhost:8082}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Kafka (les messages sont du texte JSON)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ticket-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000

# Boite d'envoi (outbox)
app.outbox.relay.enabled=true
app.outbox.relay.interval-ms=1000