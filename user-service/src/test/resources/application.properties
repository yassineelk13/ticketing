# Les tests ne contactent pas Eureka
eureka.client.enabled=false

# Valeurs réservées aux tests
app.jwt.secret=test-only-secret-for-user-service-at-least-32-bytes
app.jwt.expiration-minutes=60

# Création du schéma dans la base temporaire Testcontainers
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false