spring.application.name=user-service
server.port=8081

# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5433/user_db
spring.datasource.username=${USER_DB_USER:billetterie}
spring.datasource.password=${USER_DB_PASSWORD:billetterie}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
app.jwt.expiration-minutes=60
