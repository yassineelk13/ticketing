spring.application.name=event-service
server.port=8082

spring.mongodb.uri=mongodb://localhost:27017/event_db

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Redis (cache des evenements)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
app.cache.event-ttl-seconds=${EVENT_CACHE_TTL_SECONDS:600}

# Un cache en panne ne doit pas faire passer le service en DOWN
management.health.redis.enabled=false