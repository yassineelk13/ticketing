spring.application.name=payment-service
server.port=8084

# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5435/payment_db
spring.datasource.username=${PAYMENT_DB_USER:billetterie}
spring.datasource.password=${PAYMENT_DB_PASSWORD:billetterie}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Kafka (les messages sont du texte JSON)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Simulation du paiement : proportion de paiements refuses (0.2 = 20 %)
app.payment.failure-rate=${PAYMENT_FAILURE_RATE:0.2}

# Actuator
management.endpoints.web.exposure.include=health